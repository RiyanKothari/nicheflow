kind = "web"
previewPath = "/"
title = "NicheFlow"
version = "1.0.0"
id = "artifacts/nicheflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19419

[services.development]
run = "pnpm --filter @workspace/nicheflow run build && pnpm --filter @workspace/nicheflow run serve"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nicheflow", "run", "build" ]
publicDir = "artifacts/nicheflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19419"
BASE_PATH = "/"
